name: Update Models

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

concurrency:
  group: model-config-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run offline selection tests
        run: npm test

      - name: Run chat model selection algorithm
        id: chat
        continue-on-error: true
        run: node scripts/update-models.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEW_API_URL: ${{ secrets.NEW_API_URL }}
          NEW_API_TOKEN: ${{ secrets.NEW_API_TOKEN }}

      - name: Upload inference report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: chat-inference-report
          path: chat-probe-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit and push if changed
        if: ${{ !cancelled() && steps.chat.outcome == 'success' }}
        run: |
          git diff --quiet -- chat-models.json && echo "No changes to commit" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chat-models.json
          git commit -m "chore: update model selections (automated)"
          git push

      - name: Report selection failures
        if: ${{ !cancelled() && steps.chat.outcome == 'failure' }}
        run: |
          echo "Chat outcome: ${{ steps.chat.outcome }}"
          echo "Chat selection failed; the previous configuration was retained."
          exit 1
