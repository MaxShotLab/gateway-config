name: Update Models

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

concurrency:
  group: model-config-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Studio updater
        id: tests
        run: npm test

      - name: Run chat model selection algorithm
        id: chat
        continue-on-error: true
        run: node scripts/update-models.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEW_API_URL: ${{ secrets.NEW_API_URL }}
          NEW_API_TOKEN: ${{ secrets.NEW_API_TOKEN }}

      - name: Run Studio model selection algorithm
        id: studio
        continue-on-error: true
        run: node scripts/update-studio-models.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Commit and push if changed
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          git diff --quiet -- chat-models.json studio-models.json && echo "No changes to commit" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chat-models.json studio-models.json
          git commit -m "chore: update model selections (automated)"
          git push

      - name: Report selection failures
        if: ${{ !cancelled() && (steps.chat.outcome == 'failure' || steps.studio.outcome == 'failure') }}
        run: |
          echo "Chat outcome: ${{ steps.chat.outcome }}"
          echo "Studio outcome: ${{ steps.studio.outcome }}"
          echo "Valid changes were committed; failed selections retained their previous configuration."
          exit 1
