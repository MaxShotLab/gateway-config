name: Update Chat Models

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run model selection algorithm
        run: node scripts/update-models.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEW_API_URL: ${{ secrets.NEW_API_URL }}
          NEW_API_TOKEN: ${{ secrets.NEW_API_TOKEN }}

      - name: Commit and push if changed
        run: |
          git diff --quiet chat-models.json && echo "No changes to commit" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chat-models.json
          git commit -m "chore: update chat-models.json (automated)"
          git push
